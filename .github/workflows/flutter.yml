# Flutter app (apps/mobile, L-100). Flutter is not installed locally, so this
# workflow is the compiler and test runner: iterate on a draft PR.
#
# `flutter` is a required check (.github/required-checks/flutter.json), so there
# is no trigger-level `paths:` filter. Instead its changes step diffs against
# the PR base, or origin/main for any other event (for a push to main, where
# origin/main is HEAD, the previous tip), and the job exits green when nothing
# under apps/mobile, packages/schema/fixtures, the site's string catalogs
# (apps/web/src/i18n, which the app's strings are generated from, L-114) or
# this file changed.
# `workflow_dispatch` lets the merge-rule job (L-031) re-run it on the approval
# commit.
#
# `ios` is not a required check. It runs after `flutter` on push to main and on
# PRs labelled `ios-build` (the `labeled` trigger re-runs the workflow when the
# label is added).
#
# Goldens (L-108, apps/mobile/test/goldens/screens/) are drawn here on Linux,
# never locally. To draw new ones, run this workflow by hand on the PR branch
# with `update_goldens`, download the `flutter-goldens` artifact into
# apps/mobile/test/goldens/screens/ and commit it. Every run uploads the
# goldens it compared against, and the diffs as `flutter-golden-failures`
# when a compare fails.
name: Flutter

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      update_goldens:
        description: Redraw the golden images instead of comparing them
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/mobile

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Did apps/mobile, the schema fixtures or the catalogs change?
        id: changes
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            base="$PR_BASE"
          elif [ "$EVENT" = push ] && [ -n "$BEFORE" ] && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            base="$BEFORE"
          else
            base=origin/main
          fi
          echo "Diffing against $base"
          changed="$(git diff --name-only "$base"...HEAD)"
          if grep -qE '^(apps/mobile/|packages/schema/fixtures/|apps/web/src/i18n/[^/]+/[^/]+\.json$|\.github/workflows/flutter\.yml$)' <<<"$changed"; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing relevant to the Flutter app changed."
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Nothing to do
        if: steps.changes.outputs.relevant != 'true'
        working-directory: .
        run: echo "No changes under apps/mobile or packages/schema/fixtures; the check passes."
      - uses: actions/setup-java@v6
        if: steps.changes.outputs.relevant == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        if: steps.changes.outputs.relevant == 'true'
        with:
          channel: stable
          flutter-version-file: apps/mobile/pubspec.yaml
          cache: true
      # pubspec.lock is committed; a stale or missing lock fails instead of
      # silently re-resolving.
      - name: flutter pub get --enforce-lockfile
        if: steps.changes.outputs.relevant == 'true'
        run: |
          if [ ! -f pubspec.lock ]; then
            echo "::error::apps/mobile/pubspec.lock is missing. Commit this resolution:"
            flutter pub get >/dev/null
            cat pubspec.lock
            exit 1
          fi
          flutter pub get --enforce-lockfile
          # pub upgrades analysis_options.yaml in place when it lacks the
          # platform excludes; the committed file must already be that form.
          if ! git diff --exit-code -- analysis_options.yaml; then
            echo "::error::flutter pub get rewrote apps/mobile/analysis_options.yaml; commit the version above."
            exit 1
          fi
      # L-114: lib/l10n/app_*.arb and catalog.g.dart are generated from the
      # site's catalogs (apps/web/src/i18n) and lib/l10n/catalog; a catalog
      # change must come with the regenerated files.
      - name: l10n files in sync with the catalogs
        if: steps.changes.outputs.relevant == 'true'
        run: |
          if ! dart run tool/sync_l10n.dart --check; then
            echo "::error::Run 'dart run tool/sync_l10n.dart' in apps/mobile and commit the result:"
            dart run tool/sync_l10n.dart
            git diff
            exit 1
          fi
      - name: dart format --set-exit-if-changed
        if: steps.changes.outputs.relevant == 'true'
        run: |
          if ! dart format --output=none --set-exit-if-changed .; then
            echo "::error::Run 'dart format .' in apps/mobile. The formatter would change:"
            dart format . >/dev/null
            git diff
            exit 1
          fi
      - run: flutter analyze
        if: steps.changes.outputs.relevant == 'true'
      # Import every lib/ file from a generated test, so files no test loads
      # still count (as uncovered) in lcov.
      - run: dart run tool/check_coverage.dart --prepare
        if: steps.changes.outputs.relevant == 'true'
      - name: Redraw the goldens
        if: steps.changes.outputs.relevant == 'true' && inputs.update_goldens
        run: flutter test --update-goldens test/goldens/screens_golden_test.dart
      - run: flutter test --coverage
        if: steps.changes.outputs.relevant == 'true'
      - name: Upload goldens
        if: ${{ !cancelled() && steps.changes.outputs.relevant == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: flutter-goldens
          path: apps/mobile/test/goldens/screens/*.png
          retention-days: 14
          if-no-files-found: warn
      - name: Upload golden failures
        if: ${{ failure() && steps.changes.outputs.relevant == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: flutter-golden-failures
          path: apps/mobile/test/goldens/failures/
          retention-days: 14
          if-no-files-found: ignore
      # Dart line coverage >= minCoverage (96) in tool/check_coverage.dart,
      # generated *.g.dart/*.freezed.dart excluded.
      - run: dart run tool/check_coverage.dart
        if: steps.changes.outputs.relevant == 'true'
      - name: Upload lcov
        if: ${{ !cancelled() && steps.changes.outputs.relevant == 'true' && hashFiles('apps/mobile/coverage/lcov.info') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: flutter-coverage-lcov
          path: apps/mobile/coverage/lcov.info
          retention-days: 14
      - name: Bundle id is io.github.nyabongo.lectio
        if: steps.changes.outputs.relevant == 'true'
        run: grep -q 'applicationId = "io.github.nyabongo.lectio"' android/app/build.gradle.kts
      - run: flutter build apk --debug
        if: steps.changes.outputs.relevant == 'true'
      - name: Upload debug APK
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: lectio-debug-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error

  ios:
    needs: flutter
    if: >-
      needs.flutter.outputs.relevant == 'true' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ios-build')))
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version-file: apps/mobile/pubspec.yaml
          cache: true
      - run: flutter pub get --enforce-lockfile
      # ios/ is not committed yet (L-104 commits it): generate it from the
      # pinned Flutter. flutter create never overwrites existing files.
      - name: Materialise ios/
        run: |
          if [ ! -d ios ]; then
            flutter create --no-pub --org io.github.nyabongo --project-name lectio --platforms ios .
          fi
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = io.github.nyabongo.lectio;' ios/Runner.xcodeproj/project.pbxproj
          # L-114: declare English and Kiswahili (commit this with ios/).
          if ! /usr/libexec/PlistBuddy -c 'Print :CFBundleLocalizations' ios/Runner/Info.plist >/dev/null 2>&1; then
            /usr/libexec/PlistBuddy -c 'Add :CFBundleLocalizations array' \
              -c 'Add :CFBundleLocalizations:0 string en' \
              -c 'Add :CFBundleLocalizations:1 string sw' ios/Runner/Info.plist
          fi
      - run: flutter build ios --no-codesign --debug
      - name: Upload Runner.app
        uses: actions/upload-artifact@v7
        with:
          name: lectio-ios-debug
          path: apps/mobile/build/ios/iphoneos/Runner.app
          retention-days: 14
          if-no-files-found: error
