# Content gates (L-031): the trusted side, and the only workflow that holds a write token or the
# verifier keys (owner exception for going online, L-201).
#
#   content-checks.yml (pull_request, read-only)  ──workflow_run──▶  this file (main's copy only)
#   /approve comment ──issue_comment──▶ this file;  decide ──workflow_dispatch on main──▶ this file
#
#   resolve → gates-trusted → verifiers → decide (decide → approve → artifact → dispatch) → merge
#
# The job names differ from the check names on purpose: these jobs report on main's tip, and the
# `decide` job publishes the `merge-rule` check on the PR head through the Checks API. That check is
# not a job, so it is not in .github/required-checks/; branch protection (L-032) requires it by name
# next to content-checks.json, and the merge job waits for it with the registry's checks.
#
# Every trigger runs the default branch's copy of this file: `workflow_run` and `issue_comment`
# always do, and a `workflow_dispatch` off the default branch does nothing (every job requires
# `github.ref` to be the default branch). A PR can edit content-checks.yml, never this file's run.
#
# Threat model and trust boundaries
# - Nothing produced by the PR-side run is used. `resolve` re-reads the PR and its head from GitHub:
#   the PRs GitHub lists for the completed run, or the open PR whose head is the run's head sha, and
#   that head must still be the PR's head. The deterministic gates run again here.
# - Base-checkout rule: every job checks out main at the commit `resolve` saw and runs `npm ci`
#   there. The PR head is fetched only as data (pr-head/); files are read as regular-file git blobs,
#   a changed symbolic link or submodule fails the run, and nothing from the PR is installed or run,
#   so a PR that edits `decide` or a gate cannot change its own decision. The config, the registry
#   and the Prettier config come from main.
# - Permissions are per job and default to none. `resolve` and `gates-trusted` read; `verifiers`
#   reads and is the only job with secrets (the two verifier LLM keys, never for a fork PR);
#   `decide` and `merge` write. Checkouts never persist the token; GH_TOKEN goes only to the
#   tooling steps that need it.
# - The approval commit names this run (`Lectio-Approval: <kind> run=<id> head=<sha>`). It counts only
#   if that run executed main's copy and uploaded the artifact `lectio-approval-pr<n>-<commit sha>`
#   naming this PR and this exact commit (only a run's own jobs can upload to it; a commit sha fixes
#   the parent and the whole tree). A forged commit with the same parent and trailer but other
#   content has another sha and is blocked. The merge uses --match-head-commit on that sha. Run
#   titles are never trusted.
# - Fork PRs are report-only: a red `merge-rule` check and the job summary, no labels, comments,
#   commits or verifiers; a maintainer merges them by hand. A `.github/**` PR gets no approval
#   commit, no dispatch and no merge from here; a maintainer merges it by hand after approval.
# - Revoking an approval (removing the label, deleting the comment) after the approval commit was
#   written does not stop the merge job; a maintainer closes the PR or pushes to it instead.
# - The `/approve` pre-filter below is `startsWith` on the raw body (no trimming in expressions);
#   the tooling then checks the trimmed first line against config.reviewer.approvalCommand.
name: Content gates
run-name: Content gates (${{ github.event_name }})

on:
  workflow_run:
    workflows: [Content checks]
    types: [completed]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string

permissions: {}

# Per event type and PR (per head sha for workflow_run). A comment that is not `/approve` gets a group
# of its own, so it can never cancel a queued gate run.
concurrency:
  group: >-
    content-gates-${{ github.event_name }}-${{
      (github.event_name == 'issue_comment' && !(github.event.issue.pull_request && startsWith(github.event.comment.body, '/approve')))
        && format('unrelated-{0}', github.run_id)
        || github.event.workflow_run.head_sha || github.event.issue.number || inputs.pr
    }}
  cancel-in-progress: false

env:
  NODE_VERSION: 22

jobs:
  resolve:
    if: >-
      ${{
        (github.event_name != 'issue_comment' || (github.event.issue.pull_request && startsWith(github.event.comment.body, '/approve')))
        && (github.event_name != 'workflow_dispatch' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tool-sha: ${{ steps.tool.outputs.sha }}
      run: ${{ steps.resolve.outputs.run }}
      pr: ${{ steps.resolve.outputs.pr }}
      head-sha: ${{ steps.resolve.outputs.head-sha }}
      base-ref: ${{ steps.resolve.outputs.base-ref }}
      fork: ${{ steps.resolve.outputs.fork }}
      verifiers: ${{ steps.resolve.outputs.verifiers }}
      relevant: ${{ steps.changes.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Tooling commit
        id: tool
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Resolve the PR and head from GitHub
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: npm run --silent -w @lectio/gates gates -- ci resolve
      - name: Fetch the PR head as data (pr-head/)
        if: steps.resolve.outputs.run == 'true'
        env:
          PR: ${{ steps.resolve.outputs.pr }}
          HEAD_SHA: ${{ steps.resolve.outputs.head-sha }}
          BASE_REF: ${{ steps.resolve.outputs.base-ref }}
        run: |
          git fetch --no-tags origin "+refs/pull/${PR}/head:refs/remotes/pr/head" "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null || git fetch --no-tags origin "$HEAD_SHA"
          git worktree add --detach pr-head "$HEAD_SHA"
      # A changed symbolic link or submodule fails this step; decide then reports it as blocked.
      - name: Detect relevant changes
        id: changes
        if: steps.resolve.outputs.run == 'true'
        continue-on-error: true
        env:
          BASE_REF: ${{ steps.resolve.outputs.base-ref }}
          HEAD_SHA: ${{ steps.resolve.outputs.head-sha }}
        run: npm run --silent -w @lectio/gates gates -- ci changes --root pr-head --base "origin/$BASE_REF" --head "$HEAD_SHA"

  gates-trusted:
    needs: resolve
    if: ${{ needs.resolve.outputs.run == 'true' && needs.resolve.outputs.relevant == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tool-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Fetch the PR head as data (pr-head/)
        env:
          PR: ${{ needs.resolve.outputs.pr }}
          HEAD_SHA: ${{ needs.resolve.outputs.head-sha }}
          BASE_REF: ${{ needs.resolve.outputs.base-ref }}
        run: |
          git fetch --no-tags origin "+refs/pull/${PR}/head:refs/remotes/pr/head" "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null || git fetch --no-tags origin "$HEAD_SHA"
          git worktree add --detach pr-head "$HEAD_SHA"
      # Schema, evidence and licence again, here: the PR-side results are never trusted.
      - name: Deterministic gates
        env:
          BASE_REF: ${{ needs.resolve.outputs.base-ref }}
        run: >-
          npm run --silent -w @lectio/gates gates -- run --gates schema,evidence,licence --fetch live
          --root pr-head --base "origin/$BASE_REF" --json out/deterministic/gates.json --markdown out/deterministic/comment.md
      - name: Gate summary
        if: ${{ !cancelled() && hashFiles('out/deterministic/comment.md') != '' }}
        run: cat out/deterministic/comment.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && hashFiles('out/deterministic/gates.json') != '' }}
        with:
          name: deterministic
          path: out/deterministic/
          retention-days: 14

  verifiers:
    needs: [resolve, gates-trusted]
    # Only on a new head that is not an approval commit, and never for a fork PR.
    if: ${{ needs.gates-trusted.result == 'success' && needs.resolve.outputs.verifiers == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tool-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Fetch the PR head as data (pr-head/)
        env:
          PR: ${{ needs.resolve.outputs.pr }}
          HEAD_SHA: ${{ needs.resolve.outputs.head-sha }}
          BASE_REF: ${{ needs.resolve.outputs.base-ref }}
        run: |
          git fetch --no-tags origin "+refs/pull/${PR}/head:refs/remotes/pr/head" "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null || git fetch --no-tags origin "$HEAD_SHA"
          git worktree add --detach pr-head "$HEAD_SHA"
      # Live clients only for the keys that are set; without both, the gate is skipped and the merge
      # rule asks for review.
      - name: LLM verifiers
        env:
          BASE_REF: ${{ needs.resolve.outputs.base-ref }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: >-
          npm run --silent -w @lectio/gates gates -- run --gates verifiers --fetch live --llm live
          --root pr-head --base "origin/$BASE_REF" --json out/verifiers/gates.json --markdown out/verifiers/comment.md
      - name: Gate summary
        if: ${{ !cancelled() && hashFiles('out/verifiers/comment.md') != '' }}
        run: cat out/verifiers/comment.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && hashFiles('out/verifiers/gates.json') != '' }}
        with:
          name: verifiers
          path: out/verifiers/
          retention-days: 14

  decide:
    needs: [resolve, gates-trusted, verifiers]
    if: ${{ !cancelled() && needs.resolve.result == 'success' && needs.resolve.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: write
      checks: write
    concurrency:
      group: content-gates-merge-rule-${{ needs.resolve.outputs.pr }}
      cancel-in-progress: false
    outputs:
      decision: ${{ steps.decide.outputs.decision }}
      manual-merge: ${{ steps.decide.outputs.manual-merge }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tool-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Nothing relevant changed: a green merge-rule check on the head, and nothing else.
      - name: Nothing to decide
        if: needs.resolve.outputs.relevant == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.resolve.outputs.head-sha }}
        run: >-
          npm run --silent -w @lectio/gates gates -- ci skip --head-sha "$HEAD_SHA"
          --reason "Nothing relevant to the content gates changed (passages/, calendar/, corpus/, config/)."
      - name: Fetch the PR head as data (pr-head/)
        id: fetch
        if: needs.resolve.outputs.relevant != 'false'
        env:
          PR: ${{ needs.resolve.outputs.pr }}
          HEAD_SHA: ${{ needs.resolve.outputs.head-sha }}
          BASE_REF: ${{ needs.resolve.outputs.base-ref }}
        run: |
          git fetch --no-tags origin "+refs/pull/${PR}/head:refs/remotes/pr/head" "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          git cat-file -e "${HEAD_SHA}^{commit}" 2>/dev/null || git fetch --no-tags origin "$HEAD_SHA"
          git worktree add --detach pr-head "$HEAD_SHA"
          echo "base-sha=$(git rev-parse "refs/remotes/origin/${BASE_REF}")" >> "$GITHUB_OUTPUT"
      # One artifact per gates job, each by name into out/<name>/: download-artifact unpacks a lone
      # artifact straight into `path` when no name is given, so never rely on that layout.
      - uses: actions/download-artifact@v8
        if: needs.resolve.outputs.relevant != 'false' && needs.gates-trusted.result != 'skipped'
        continue-on-error: true
        with:
          name: deterministic
          path: out/deterministic
      - uses: actions/download-artifact@v8
        if: needs.resolve.outputs.relevant != 'false' && needs.verifiers.result != 'skipped'
        continue-on-error: true
        with:
          name: verifiers
          path: out/verifiers
      # Decides, labels and comments; reports the check unless an approval commit is due.
      - name: Merge rule (decide)
        id: decide
        if: needs.resolve.outputs.relevant != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR: ${{ needs.resolve.outputs.pr }}
          HEAD_SHA: ${{ needs.resolve.outputs.head-sha }}
          BASE_SHA: ${{ steps.fetch.outputs.base-sha }}
          GATES_RESULT: ${{ needs.gates-trusted.result }}
          VERIFIERS_RESULT: ${{ needs.verifiers.result }}
        run: >-
          npm run --silent -w @lectio/gates gates -- ci merge-rule --phase decide --pr "$PR" --head-sha "$HEAD_SHA"
          --base "$BASE_SHA" --root pr-head
          --results out/deterministic/gates.json --job-result "out/deterministic/gates.json=$GATES_RESULT"
          --results out/verifiers/gates.json --job-result "out/verifiers/gates.json=$VERIFIERS_RESULT"
      # Writes the review block and the approval commit.
      - name: Merge rule (approve)
        id: approve
        if: steps.decide.outputs.write == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR: ${{ needs.resolve.outputs.pr }}
          HEAD_SHA: ${{ needs.resolve.outputs.head-sha }}
          BASE_SHA: ${{ steps.fetch.outputs.base-sha }}
          GATES_RESULT: ${{ needs.gates-trusted.result }}
          VERIFIERS_RESULT: ${{ needs.verifiers.result }}
        run: >-
          npm run --silent -w @lectio/gates gates -- ci merge-rule --phase approve --pr "$PR" --head-sha "$HEAD_SHA"
          --base "$BASE_SHA" --root pr-head
          --results out/deterministic/gates.json --job-result "out/deterministic/gates.json=$GATES_RESULT"
          --results out/verifiers/gates.json --job-result "out/verifiers/gates.json=$VERIFIERS_RESULT"
      # The evidence that this run wrote this exact approval commit for this PR, uploaded before
      # anything is dispatched on it.
      - uses: actions/upload-artifact@v7
        if: steps.approve.outputs.approval-artifact != ''
        with:
          name: ${{ steps.approve.outputs.approval-artifact }}
          path: out/approval/approval.json
          retention-days: 90
      # Dispatches the required-check workflows on the approval commit and reports the check.
      - name: Merge rule (dispatch)
        if: steps.approve.outputs.approval-commit != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR: ${{ needs.resolve.outputs.pr }}
          HEAD_SHA: ${{ needs.resolve.outputs.head-sha }}
          BASE_SHA: ${{ steps.fetch.outputs.base-sha }}
          APPROVAL_COMMIT: ${{ steps.approve.outputs.approval-commit }}
        run: >-
          npm run --silent -w @lectio/gates gates -- ci merge-rule --phase dispatch --pr "$PR" --head-sha "$HEAD_SHA"
          --base "$BASE_SHA" --root pr-head --approval-commit "$APPROVAL_COMMIT"
      # The full report (every result, the head and the decision) for readers of a truncated comment.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && hashFiles('out/report/gates.json') != '' }}
        with:
          name: gates-report
          path: out/report/gates.json
          retention-days: 90

  merge:
    needs: [resolve, decide]
    if: ${{ needs.decide.result == 'success' && needs.decide.outputs.decision == 'approved-commit' && needs.decide.outputs.manual-merge != 'true' && needs.resolve.outputs.fork != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      actions: write
      checks: read
      statuses: read
    concurrency:
      group: content-gates-merge-${{ needs.resolve.outputs.pr }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve.outputs.tool-sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Waits for every required check in the registry on the approval commit, squash-merges with
      # --match-head-commit, then dispatches deploy.yml (a notice until it exists, L-062).
      - name: Merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.resolve.outputs.pr }}
          HEAD_SHA: ${{ needs.resolve.outputs.head-sha }}
        run: npm run --silent -w @lectio/gates gates -- ci merge --pr "$PR" --sha "$HEAD_SHA"
